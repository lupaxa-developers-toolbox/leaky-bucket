[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "lupaxa-leaky-bucket"
dynamic = ["version"]
description = "Leaky-bucket rate limiter with drop and queue modes."
readme = "README.md"
license = { file = "LICENCE" }
requires-python = ">=3.10"

authors = [
  { name = "The Lupaxa Project" }
]

keywords = ["leaky-bucket", "rate-limit", "throttle", "queue"]

dependencies = []

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/lupaxa-developers-toolbox/leaky-bucket"
Documentation = "https://github.com/lupaxa-developers-toolbox/leaky-bucket"
Repository = "https://github.com/lupaxa-developers-toolbox/leaky-bucket"
Issues = "https://github.com/lupaxa-developers-toolbox/leaky-bucket/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6.0",
  "mypy>=1.12.0",
  "hatch>=1.12.0",
  "bump-my-version>=1.2.0",
]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.hatch.version]
path = "src/lupaxa/leaky_bucket/version.py"

[tool.hatch.build.targets.sdist]
include = [
  "src/**",
  "README.md",
  "LICENCE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lupaxa"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra -q --disable-warnings"
testpaths = ["tests"]
pythonpath = ["src"]
